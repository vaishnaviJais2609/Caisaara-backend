services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: caisaara
      POSTGRES_DB: caisaara
      POSTGRES_PASSWORD: ${DB_PASSWORD:-caisaara}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: caisaara-redis
    restart: unless-stopped
    network_mode: host

  backend:
    build: .
    image: caisaara-backend:latest
    container_name: caisaara-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - GIN_MODE=release
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:


